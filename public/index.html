<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171a21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="다음 수업" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/auth.css" />
    <title>다음 수업</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow" id="todayLabel">오늘의 시간표</p>
          <h1>다음 수업</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button refresh-button" id="refreshButton" aria-label="앱 업데이트 새로고침" title="최신 버전으로 새로고침">↻</button>
          <button class="icon-button" id="installButton" hidden>설치</button>
        </div>
      </header>

      <section class="account-panel">
        <div id="signedOutView">
          <div class="account-copy"><strong>계정으로 시간표 동기화</strong><p>다른 기기에서도 같은 시간표를 사용할 수 있어요.</p></div>
          <button class="secondary compact" id="openAuthButton">로그인 · 회원가입</button>
        </div>
        <div id="signedInView" hidden>
          <div class="account-copy"><strong><span id="accountName"></span>님</strong><p>이 계정의 시간표와 동기화 중이에요.</p></div>
          <button class="text-button" id="logoutButton">로그아웃</button>
        </div>
      </section>

      <section class="next-card" id="nextCard">
        <span class="status-dot"></span>
        <p class="card-label">NEXT CLASS</p>
        <h2 id="nextName">시간표를 추가해 주세요</h2>
        <p id="nextMeta">아래에서 오늘 수업을 등록할 수 있어요.</p>
        <div class="countdown" id="countdown">—</div>
      </section>

      <section class="push-panel">
        <div>
          <strong>수업 전 알림</strong>
          <p id="pushStatus">홈 화면에 설치하면 푸시 알림을 받을 수 있어요.</p>
        </div>
        <button class="primary small" id="pushButton">알림 켜기</button>
      </section>

      <section class="cycle-panel">
        <label>시간표 반복
          <select id="cycle">
            <option value="weekly">매주 동일</option>
            <option value="biweekly">격주 A/B</option>
          </select>
        </label>
        <label id="anchorField" hidden>A주가 시작되는 월요일
          <input id="anchorDate" type="date" />
        </label>
      </section>

      <nav class="week-tabs" id="weekTabs" aria-label="격주 선택" hidden>
        <button class="week-tab active" data-week="A">A주</button>
        <button class="week-tab" data-week="B">B주</button>
      </nav>

      <nav class="days" id="days" aria-label="요일 선택"></nav>

      <section class="schedule-section">
        <div class="section-title">
          <h2 id="dayTitle">월요일</h2>
          <button class="text-button" id="addButton">+ 수업 추가</button>
        </div>
        <div class="class-list" id="classList"></div>
      </section>

      <section class="settings">
        <label for="reminder">알림 시점</label>
        <select id="reminder">
          <option value="5">5분 전</option>
          <option value="10" selected>10분 전</option>
          <option value="15">15분 전</option>
          <option value="30">30분 전</option>
        </select>
        <button class="secondary" id="testButton">테스트 알림 보내기</button>
        <div class="file-actions">
          <button class="secondary" id="importButton">시간표 파일 가져오기</button>
          <button class="secondary" id="exportButton">시간표 파일 내보내기</button>
          <button class="secondary accent-outline" id="promptButton">AI 변환 프롬프트 복사</button>
        </div>
        <input id="importFile" type="file" accept="application/json,.json,.nextclass" hidden />
      </section>
    </main>

    <dialog id="classDialog">
      <form method="dialog" id="classForm">
        <div class="dialog-head">
          <h2>수업 정보</h2>
          <button type="button" class="close-button" id="closeDialogButton" aria-label="닫기">×</button>
        </div>
        <input type="hidden" id="classId" />
        <label>과목명<input id="className" required maxlength="60" placeholder="예: 자료구조" /></label>
        <label>강의실<input id="classRoom" maxlength="60" placeholder="예: 공학관 302호" /></label>
        <label id="classWeekField" hidden>적용 주차
          <select id="classWeek">
            <option value="A">A주</option>
            <option value="B">B주</option>
            <option value="ALL">매주</option>
          </select>
        </label>
        <div class="time-fields">
          <label>시작<input id="classStart" type="time" required value="09:00" /></label>
          <label>종료<input id="classEnd" type="time" required value="10:15" /></label>
        </div>
        <div class="dialog-actions">
          <button type="button" class="danger" id="deleteButton" hidden>삭제</button>
          <button class="primary" value="default">저장</button>
        </div>
      </form>
    </dialog>

    <dialog id="authDialog">
      <form id="authForm">
        <div class="dialog-head">
          <h2 id="authTitle">로그인</h2>
          <button type="button" class="close-button" id="closeAuthButton" aria-label="닫기">×</button>
        </div>
        <p class="auth-description" id="authDescription">계정의 시간표를 이 기기로 불러옵니다.</p>
        <label>아이디<input id="authUsername" required minlength="4" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="영문, 숫자, 밑줄 4~20자" /></label>
        <label>비밀번호<input id="authPassword" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="8자 이상" /></label>
        <button class="primary auth-submit" id="authSubmitButton" type="submit">로그인</button>
        <button class="text-button auth-switch" id="authSwitchButton" type="button">처음이신가요? 회원가입</button>
        <p class="auth-note">비밀번호 찾기는 아직 지원하지 않으니 안전하게 보관해 주세요.</p>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
    <script type="module" src="/auth.js"></script>
  </body>
</html>
